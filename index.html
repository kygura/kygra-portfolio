<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nicolás Cerrato Anton — index</title>
    <meta name="description" content="Software, writing and artifacts by Nicolás Cerrato Anton. Hand-built, no tracking." />

    <meta property="og:title" content="Nicolás Cerrato Anton — index" />
    <meta property="og:description" content="Software, writing and artifacts. Hand-built, no tracking." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Linked here rather than @import-ed from index.css: an @import cannot
         begin downloading until the stylesheet that contains it has arrived,
         which serialises fonts behind the CSS request. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    >
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EEE8DA'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%2315120F' stroke-width='2'/%3E%3Ctext x='16' y='24' font-family='Impact,Arial Narrow,sans-serif' font-weight='900' font-size='20' text-anchor='middle' fill='%23FF4A1A'%3EN%3C/text%3E%3C/svg%3E" />
    <script>
      // Paint the right stock before React mounts, so the first frame is not a flash of paper on an inverted session.
      try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
